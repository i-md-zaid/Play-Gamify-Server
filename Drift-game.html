<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DRIFT</title>
<style>
  :root {
    --bg: #0D1117;
    --panel: #131A24;
    --line: #232C39;
    --player: #F2C14E;
    --obstacle: #4A6FA5;
    --obstacle2: #6C8EBF;
    --text: #E8E6E1;
    --muted: #6B7686;
    --danger: #C1440E;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .stage {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 20px;
  }
  .title {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.14em;
    color: var(--player);
    margin: 0;
  }
  .sub {
    font-size: 12px;
    color: var(--muted);
    margin: -10px 0 0 0;
  }
  .frame {
    position: relative;
    border: 1px solid var(--line);
    background: var(--panel);
    border-radius: 3px;
  }
  canvas {
    display: block;
    border-radius: 3px;
  }
  .hud {
    position: absolute;
    top: 12px;
    left: 14px;
    right: 14px;
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    color: var(--muted);
    pointer-events: none;
  }
  .hud .score {
    color: var(--text);
    font-weight: 600;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: rgba(13, 17, 23, 0.86);
    border-radius: 3px;
    text-align: center;
    padding: 20px;
  }
  .overlay.hidden { display: none; }
  .overlay h2 {
    margin: 0;
    font-size: 20px;
    font-weight: 700;
    color: var(--text);
  }
  .overlay p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
    max-width: 240px;
    line-height: 1.5;
  }
  .best {
    color: var(--player);
  }
  button {
    margin-top: 6px;
    background: var(--player);
    color: #17130A;
    border: none;
    padding: 9px 20px;
    font-size: 13px;
    font-weight: 700;
    border-radius: 3px;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  button:hover { filter: brightness(1.08); }
  .keys {
    display: flex;
    gap: 8px;
    margin-top: 4px;
  }
  .keys span {
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 3px;
  }
  .controls-hint {
    font-size: 11px;
    color: var(--muted);
    display: flex;
    gap: 6px;
    align-items: center;
  }
</style>
</head>
<body>
<div class="stage">
  <p class="title">DRIFT</p>
  <div class="frame">
    <div class="hud">
      <span>SCORE <span class="score" id="score">0</span></span>
      <span>BEST <span class="score" id="best">0</span></span>
    </div>
    <canvas id="game" width="320" height="480"></canvas>
    <div class="overlay" id="overlay">
      <h2>DRIFT</h2>
      <p>Steer clear of the debris. Arrow keys or A/D to move, or drag on touch.</p>
      <button id="startBtn">Start</button>
    </div>
  </div>
  <p class="controls-hint">← → or A / D to steer · Space to restart</p>
</div>

<script>
(function() {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');

  let best = Number(localStorage.getItem('drift_best') || 0);
  bestEl.textContent = best;

  const player = { w: 26, h: 26, x: W/2 - 13, y: H - 60, speed: 4.2 };
  let obstacles = [];
  let particles = [];
  let keys = {};
  let running = false;
  let time = 0;
  let spawnTimer = 0;
  let spawnInterval = 62;
  let fallSpeed = 2.4;
  let score = 0;
  let shakeT = 0;

  function reset() {
    obstacles = [];
    particles = [];
    player.x = W/2 - player.w/2;
    time = 0;
    spawnTimer = 0;
    spawnInterval = 62;
    fallSpeed = 2.4;
    score = 0;
    shakeT = 0;
    scoreEl.textContent = 0;
  }

  function spawnObstacle() {
    const w = 24 + Math.random() * 46;
    const x = Math.random() * (W - w);
    obstacles.push({ x, y: -30, w, h: 16 + Math.random()*10, speed: fallSpeed + Math.random()*1.2 });
  }

  function burst(x, y) {
    for (let i = 0; i < 16; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 1 + Math.random() * 3;
      particles.push({ x, y, vx: Math.cos(a)*s, vy: Math.sin(a)*s, life: 30 + Math.random()*15 });
    }
  }

  function update() {
    time++;
    spawnTimer++;
    score = Math.floor(time / 6);
    scoreEl.textContent = score;

    if (spawnInterval > 26) spawnInterval -= 0.03;
    fallSpeed += 0.0016;

    if (spawnTimer > spawnInterval) {
      spawnTimer = 0;
      spawnObstacle();
    }

    if ((keys['ArrowLeft'] || keys['a']) && player.x > 4) player.x -= player.speed;
    if ((keys['ArrowRight'] || keys['d']) && player.x < W - player.w - 4) player.x += player.speed;

    for (let i = obstacles.length - 1; i >= 0; i--) {
      const o = obstacles[i];
      o.y += o.speed;
      if (o.y > H + 40) { obstacles.splice(i, 1); continue; }
      if (
        player.x < o.x + o.w &&
        player.x + player.w > o.x &&
        player.y < o.y + o.h &&
        player.y + player.h > o.y
      ) {
        gameOver();
        return;
      }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (shakeT > 0) shakeT--;
  }

  function draw() {
    ctx.save();
    if (shakeT > 0) {
      const dx = (Math.random()-0.5) * 6 * (shakeT/12);
      const dy = (Math.random()-0.5) * 6 * (shakeT/12);
      ctx.translate(dx, dy);
    }

    ctx.fillStyle = '#0D1117';
    ctx.fillRect(-10, -10, W+20, H+20);

    // faint grid streaks for motion feel
    ctx.strokeStyle = 'rgba(74,111,165,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i < 6; i++) {
      const gx = (i * 60 + (time*1.5) % 60);
      ctx.beginPath();
      ctx.moveTo(gx, 0);
      ctx.lineTo(gx, H);
      ctx.stroke();
    }

    // obstacles
    obstacles.forEach(o => {
      ctx.fillStyle = '#4A6FA5';
      ctx.fillRect(o.x, o.y, o.w, o.h);
      ctx.fillStyle = 'rgba(108,142,191,0.5)';
      ctx.fillRect(o.x, o.y, o.w, 3);
    });

    // particles
    particles.forEach(p => {
      ctx.globalAlpha = Math.max(p.life / 40, 0);
      ctx.fillStyle = '#F2C14E';
      ctx.fillRect(p.x, p.y, 3, 3);
      ctx.globalAlpha = 1;
    });

    // player
    ctx.fillStyle = '#F2C14E';
    ctx.beginPath();
    const cx = player.x + player.w/2, cy = player.y + player.h/2;
    ctx.moveTo(cx, player.y);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.closePath();
    ctx.fill();

    ctx.restore();
  }

  function loop() {
    if (!running) return;
    update();
    if (!running) { draw(); return; }
    draw();
    requestAnimationFrame(loop);
  }

  function gameOver() {
    running = false;
    burst(player.x + player.w/2, player.y + player.h/2);
    shakeT = 12;
    draw();
    if (score > best) {
      best = score;
      localStorage.setItem('drift_best', best);
      bestEl.textContent = best;
    }
    overlay.innerHTML = `
      <h2>Wrecked</h2>
      <p>Score <span class="best">${score}</span> &nbsp;·&nbsp; Best <span class="best">${best}</span></p>
      <button id="startBtn">Try again</button>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('startBtn').addEventListener('click', startGame);
  }

  function startGame() {
    reset();
    overlay.classList.add('hidden');
    running = true;
    requestAnimationFrame(loop);
  }

  window.addEventListener('keydown', e => {
    keys[e.key] = true;
    if (e.key === ' ' && !running) startGame();
    if (['ArrowLeft','ArrowRight',' '].includes(e.key)) e.preventDefault();
  });
  window.addEventListener('keyup', e => keys[e.key] = false);

  // touch / drag controls
  let dragging = false;
  canvas.addEventListener('touchstart', () => dragging = true);
  canvas.addEventListener('touchend', () => dragging = false);
  canvas.addEventListener('touchmove', e => {
    if (!running) return;
    const rect = canvas.getBoundingClientRect();
    const scaleX = W / rect.width;
    const tx = (e.touches[0].clientX - rect.left) * scaleX;
    player.x = Math.min(Math.max(tx - player.w/2, 4), W - player.w - 4);
    e.preventDefault();
  }, { passive: false });

  startBtn.addEventListener('click', startGame);
  draw();
})();
</script>
</body>
</html>
