<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pong</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: #0F1419;
    color: #E6EDF3;
    font-family: system-ui, -apple-system, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wrap { text-align: center; }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
    letter-spacing: .5px;
  }
  p.sub {
    margin: 0 0 16px;
    color: #8B98A7;
    font-size: 0.85rem;
  }
  canvas {
    background: #161B22;
    border: 1px solid #26303D;
    border-radius: 8px;
    display: block;
    touch-action: none;
  }
  .hud {
    display: flex;
    justify-content: space-between;
    width: 480px;
    max-width: 92vw;
    margin: 0 auto 8px;
    font-size: 0.85rem;
    color: #8B98A7;
  }
  .hud span.you { color: #3FB950; font-weight: 600; }
  .hud span.cpu { color: #D29922; font-weight: 600; }
  #overlay {
    position: fixed;
    inset: 0;
    background: rgba(15,20,25,0.88);
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 12px;
  }
  #overlay.show { display: flex; }
  #overlay h2 { margin: 0; font-size: 1.6rem; }
  #overlay p { margin: 0; color: #8B98A7; text-align: center; max-width: 320px; }
  button {
    background: #3FB950;
    color: #0F1419;
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .hint {
    margin-top: 14px;
    color: #8B98A7;
    font-size: 0.75rem;
  }
  .difficulty {
    display: flex;
    gap: 8px;
    margin-top: 6px;
  }
  .difficulty button {
    background: #161B22;
    color: #8B98A7;
    border: 1px solid #26303D;
    padding: 6px 14px;
    font-size: 0.75rem;
    font-weight: 500;
  }
  .difficulty button.active {
    background: #3FB950;
    color: #0F1419;
    border-color: #3FB950;
  }
</style>
</head>
<body>

<div class="wrap">
  <h1>Pong</h1>
  <p class="sub">Move: ↑ ↓ arrow keys, W/S, or drag on canvas · Start: Space</p>
  <div class="hud">
    <div>You: <span id="scoreYou" class="you">0</span></div>
    <div id="rally">—</div>
    <div>CPU: <span id="scoreCpu" class="cpu">0</span></div>
  </div>
  <canvas id="game" width="480" height="320"></canvas>
  <p class="hint">First to 7 wins. The AI has a reaction delay — it can be beaten.</p>
</div>

<div id="overlay">
  <h2 id="overlayTitle">Pong</h2>
  <p id="overlayText">First to 7 points wins. Pick a difficulty and start.</p>
  <div class="difficulty">
    <button data-level="easy">Easy</button>
    <button data-level="normal" class="active">Normal</button>
    <button data-level="hard">Hard</button>
  </div>
  <button id="startBtn">Start</button>
</div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const scoreYouEl = document.getElementById('scoreYou');
  const scoreCpuEl = document.getElementById('scoreCpu');
  const rallyEl = document.getElementById('rally');
  const overlay = document.getElementById('overlay');
  const overlayTitle = document.getElementById('overlayTitle');
  const overlayText = document.getElementById('overlayText');
  const startBtn = document.getElementById('startBtn');
  const diffButtons = document.querySelectorAll('.difficulty button');

  const paddleW = 10, paddleH = 64;
  const player = { x: 16, y: H / 2 - paddleH / 2, speed: 6.5 };
  const cpu = { x: W - 16 - paddleW, y: H / 2 - paddleH / 2, speed: 4.2, reaction: 0.09, error: 26 };

  const ball = { x: W / 2, y: H / 2, r: 6, dx: 4, dy: 2.4, speed: 4.6 };

  const WIN_SCORE = 7;
  let scoreYou = 0, scoreCpu = 0, rally = 0;
  let running = false;
  let upPressed = false, downPressed = false;
  let difficulty = 'normal';

  const difficultySettings = {
    easy:   { speed: 3.2, reaction: 0.05, error: 42 },
    normal: { speed: 4.2, reaction: 0.09, error: 26 },
    hard:   { speed: 5.4, reaction: 0.16, error: 12 },
  };

  function applyDifficulty(level) {
    difficulty = level;
    const s = difficultySettings[level];
    cpu.speed = s.speed;
    cpu.reaction = s.reaction;
    cpu.error = s.error;
    diffButtons.forEach(b => b.classList.toggle('active', b.dataset.level === level));
  }

  function resetBall(direction) {
    ball.x = W / 2;
    ball.y = H / 2;
    ball.speed = 4.6;
    const angle = (Math.random() * 0.6 - 0.3);
    ball.dx = ball.speed * direction * Math.cos(angle);
    ball.dy = ball.speed * Math.sin(angle) + (Math.random() < 0.5 ? -1 : 1) * 0.5;
    rally = 0;
    rallyEl.textContent = '—';
  }

  function resetMatch() {
    scoreYou = 0;
    scoreCpu = 0;
    scoreYouEl.textContent = scoreYou;
    scoreCpuEl.textContent = scoreCpu;
    player.y = H / 2 - paddleH / 2;
    cpu.y = H / 2 - paddleH / 2;
    resetBall(Math.random() < 0.5 ? 1 : -1);
  }

  // CPU has a target it updates only occasionally (reaction) and aims with
  // some inaccuracy (error), which is what makes it beatable.
  let cpuTargetY = H / 2;
  function updateCpu() {
    if (Math.random() < cpu.reaction) {
      cpuTargetY = ball.y + (Math.random() * cpu.error * 2 - cpu.error);
    }
    const center = cpu.y + paddleH / 2;
    if (center < cpuTargetY - 6) cpu.y += cpu.speed;
    else if (center > cpuTargetY + 6) cpu.y -= cpu.speed;
    cpu.y = Math.max(0, Math.min(H - paddleH, cpu.y));
  }

  function update() {
    if (upPressed) player.y -= player.speed;
    if (downPressed) player.y += player.speed;
    player.y = Math.max(0, Math.min(H - paddleH, player.y));

    updateCpu();

    ball.x += ball.dx;
    ball.y += ball.dy;

    if (ball.y - ball.r < 0) { ball.y = ball.r; ball.dy *= -1; }
    if (ball.y + ball.r > H) { ball.y = H - ball.r; ball.dy *= -1; }

    // player paddle collision
    if (ball.dx < 0 &&
        ball.x - ball.r < player.x + paddleW &&
        ball.x - ball.r > player.x &&
        ball.y > player.y && ball.y < player.y + paddleH) {
      const rel = (ball.y - (player.y + paddleH / 2)) / (paddleH / 2);
      const speed = Math.min(ball.speed + 0.35, 9.5);
      ball.speed = speed;
      ball.dx = Math.abs(speed * Math.cos(rel * 0.9));
      ball.dy = speed * Math.sin(rel * 0.9);
      ball.x = player.x + paddleW + ball.r;
      rally++;
      rallyEl.textContent = rally;
    }

    // cpu paddle collision
    if (ball.dx > 0 &&
        ball.x + ball.r > cpu.x &&
        ball.x + ball.r < cpu.x + paddleW &&
        ball.y > cpu.y && ball.y < cpu.y + paddleH) {
      const rel = (ball.y - (cpu.y + paddleH / 2)) / (paddleH / 2);
      const speed = Math.min(ball.speed + 0.35, 9.5);
      ball.speed = speed;
      ball.dx = -Math.abs(speed * Math.cos(rel * 0.9));
      ball.dy = speed * Math.sin(rel * 0.9);
      ball.x = cpu.x - ball.r;
      rally++;
      rallyEl.textContent = rally;
    }

    if (ball.x < -20) {
      scoreCpu++;
      scoreCpuEl.textContent = scoreCpu;
      if (scoreCpu >= WIN_SCORE) return endGame(false);
      resetBall(1);
    } else if (ball.x > W + 20) {
      scoreYou++;
      scoreYouEl.textContent = scoreYou;
      if (scoreYou >= WIN_SCORE) return endGame(true);
      resetBall(-1);
    }
  }

  function drawNet() {
    ctx.strokeStyle = 'rgba(230,237,243,0.15)';
    ctx.lineWidth = 2;
    ctx.setLineDash([8, 10]);
    ctx.beginPath();
    ctx.moveTo(W / 2, 0);
    ctx.lineTo(W / 2, H);
    ctx.stroke();
    ctx.setLineDash([]);
  }

  function drawPaddle(p, color) {
    ctx.fillStyle = color;
    ctx.fillRect(p.x, p.y, paddleW, paddleH);
  }

  function drawBall() {
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
    ctx.fillStyle = '#E6EDF3';
    ctx.fill();
  }

  function render() {
    ctx.clearRect(0, 0, W, H);
    drawNet();
    drawPaddle(player, '#3FB950');
    drawPaddle(cpu, '#D29922');
    drawBall();
  }

  function loop() {
    if (!running) return;
    update();
    render();
    requestAnimationFrame(loop);
  }

  function startGame() {
    resetMatch();
    overlay.classList.remove('show');
    running = true;
    loop();
  }

  function endGame(playerWon) {
    running = false;
    overlayTitle.textContent = playerWon ? 'You win!' : 'CPU wins';
    overlayText.textContent = `Final score ${scoreYou}–${scoreCpu} on ${difficulty}. Press Space or tap Restart.`;
    startBtn.textContent = 'Restart';
    overlay.classList.add('show');
  }

  // Controls
  document.addEventListener('keydown', e => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') { upPressed = true; e.preventDefault(); }
    if (e.code === 'ArrowDown' || e.code === 'KeyS') { downPressed = true; e.preventDefault(); }
    if (e.code === 'Space') {
      e.preventDefault();
      if (!running) startGame();
    }
  });
  document.addEventListener('keyup', e => {
    if (e.code === 'ArrowUp' || e.code === 'KeyW') upPressed = false;
    if (e.code === 'ArrowDown' || e.code === 'KeyS') downPressed = false;
  });

  canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    const y = (e.clientY - rect.top) * (H / rect.height);
    player.y = Math.max(0, Math.min(H - paddleH, y - paddleH / 2));
  });
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const y = (e.touches[0].clientY - rect.top) * (H / rect.height);
    player.y = Math.max(0, Math.min(H - paddleH, y - paddleH / 2));
  }, { passive: false });

  diffButtons.forEach(btn => {
    btn.addEventListener('click', () => applyDifficulty(btn.dataset.level));
  });

  startBtn.addEventListener('click', startGame);

  // Initial paint
  applyDifficulty('normal');
  player.y = H / 2 - paddleH / 2;
  cpu.y = H / 2 - paddleH / 2;
  render();
  overlay.classList.add('show');
})();
</script>

</body>
</html>
